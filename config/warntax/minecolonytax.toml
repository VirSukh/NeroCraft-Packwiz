#Invest war chest funds to permanently improve a colony.
["Colony Upgrades"]
	#Enable the colony upgrade investment system
	EnableColonyUpgrades = true
	#Maximum level for each upgrade type
	# Default: 5
	# Range: 1 ~ 20
	UpgradeMaxLevel = 5
	#Base war-chest cost for first militia upgrade level
	# Default: 500
	# Range: 1 ~ 100000
	UpgradeMilitiaCostBase = 500
	#Base war-chest cost for first spy capacity upgrade level
	# Default: 300
	# Range: 1 ~ 100000
	UpgradeSpyCapacityCostBase = 300
	#Base war-chest cost for first spy speed upgrade level
	# Default: 200
	# Range: 1 ~ 100000
	UpgradeSpySpeedCostBase = 200
	#Base war-chest cost for first spy evasion upgrade level
	# Default: 400
	# Range: 1 ~ 100000
	UpgradeSpyEvasionCostBase = 400
	#Base war-chest cost for first raid force upgrade level
	# Default: 600
	# Range: 1 ~ 100000
	UpgradeRaidForceCostBase = 600
	#Base war-chest cost for first defense upgrade level
	# Default: 350
	# Range: 1 ~ 100000
	UpgradeDefenseCostBase = 350
	#Cost multiplier per upgrade level (e.g. 2.0 means each level costs double the previous)
	# Default: 2.0
	# Range: 1.0 ~ 10.0
	UpgradeCostScalingFactor = 2.0
	#Militia size multiplier added per upgrade level (0.1 = +10% per level)
	# Default: 0.1
	# Range: 0.01 ~ 1.0
	UpgradeMilitiaMultiplierPerLevel = 0.1
	#Additional concurrent spies per upgrade level
	# Default: 1
	# Range: 1 ~ 10
	UpgradeSpyCapacityPerLevel = 1
	#Spy travel speed multiplier per upgrade level (0.2 = +20% faster per level)
	# Default: 0.2
	# Range: 0.01 ~ 1.0
	UpgradeSpySpeedMultiplierPerLevel = 0.2
	#Detection chance reduction per evasion upgrade level (0.05 = -5% per level)
	# Default: 0.05
	# Range: 0.01 ~ 0.5
	UpgradeDetectionReductionPerLevel = 0.05
	#Additional guard resistance level per defense upgrade level
	# Default: 1
	# Range: 1 ~ 5
	UpgradeDefenseBonusPerLevel = 1
	#Base war-chest cost to purchase one level of Treasury Cap investment.
	# Default: 3000
	# Range: > 1
	UpgradeTreasuryCapCostBase = 3000
	#Base war-chest cost to purchase one level of Tax Efficiency investment.
	# Default: 4000
	# Range: > 1
	UpgradeTaxEfficiencyCostBase = 4000
	#Base war-chest cost to purchase one level of Fortification investment.
	# Default: 3500
	# Range: > 1
	UpgradeFortificationCostBase = 3500
	#Base war-chest cost to purchase one level of Counter Intelligence investment.
	# Default: 5000
	# Range: > 1
	UpgradeCounterIntelCostBase = 5000
	#Flat treasury capacity increase per Treasury Cap level.
	# Default: 2000
	# Range: > 1
	UpgradeTreasuryCapFlatPerLevel = 2000
	#Tax generation bonus per Tax Efficiency level (fraction, e.g. 0.05 = +5%).
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	UpgradeTaxEfficiencyPercentPerLevel = 0.05
	#Fraction of incoming siege/raid damage reduced per Fortification level (e.g. 0.05 = 5%). Capped at 75%.
	# Default: 0.05
	# Range: 0.0 ~ 0.5
	UpgradeFortificationDamageReductionPerLevel = 0.05
	#Chance per Counter Intelligence level to auto-detect an incoming spy on arrival (e.g. 0.10 = 10%). Capped at 90%.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	UpgradeCounterIntelDetectChancePerLevel = 0.1
	#Multiplier bonus per Raid Force level applied to attacker effectiveness (e.g. 0.10 = +10% per level).
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	UpgradeRaidForceMultiplierPerLevel = 0.1

#Compatibility with the Hundred Years Warfare mod (no effect when it is not installed).
["Hundred Years Warfare"]
	#If Hundred Years Warfare is installed, stop HYW troops from attacking their own commander's and allied colonists (and stop those colonists from retaliating). Enemy colonists remain attackable while a sanctioned War 'n Taxes war or raid is active against their colony. No effect if Hundred Years Warfare is not loaded.
	EnableHywFriendlyFireProtection = true
	#While a war is being fought, Hundred Years Warfare troops on one side attack the players of the other side. No effect if Hundred Years Warfare is not loaded.
	EnableHywAutoHostility = true
	#Blocks around the contested colony where troops are made hostile.
	# Default: 160
	# Range: 16 ~ 1024
	HywHostilityRadius = 160
	#Seconds between hostility refreshes.
	# Default: 5
	# Range: 1 ~ 120
	HywHostilityRefreshSeconds = 5
	#Players in the same faction and players of allied factions are set to Friendly toward each other in the Hundred Years Warfare relations, and players of enemy factions are set to Hostile toward your faction's players. Only relations that are still Neutral are changed. No effect if Hundred Years Warfare is not loaded.
	SyncFactionRelations = true

#How many members of a colony must be online before it can be warred on or raided.
["Member Presence"]
	#A colony can only be declared war on or raided while enough of its members are online. Turn this off to go back to the old rules: the owner must be online for a war, and raids follow AllowOfflineRaids.
	RequireMembersOnline = true
	#Members that must be online. The colony owner and its officers count.
	# Default: 1
	# Range: 1 ~ 50
	MinMembersOnline = 1
	#Members of the colony owner's faction (Holdfast) count as members. Only used when a faction mod is installed.
	CountFactionMembers = true

#Extra, experimental ways to win a war (off by default).
["Siege Objectives"]
	#EXPERIMENTAL — when enabled, full wars get additional win conditions:
	#the attacker can win by landing N explosive hits on the defender's Town Hall,
	#or by planting and holding a Siege Banner inside the Town Hall.
	#Runs IN PARALLEL with the legacy lives+guards system — first trigger wins.
	EnableExperimentalSiegeObjectives = false
	#Number of counted explosive hits on the Town Hall building required for attacker victory.
	# Default: 5
	# Range: 1 ~ 50
	TownHallExplosiveHitsRequired = 5
	#Per-attacker cooldown (minutes) between counted Town Hall hits.
	# Default: 5
	# Range: 1 ~ 60
	TownHallHitCooldownMinutes = 5
	#Maximum distance (blocks) from the Town Hall centre the attacker may be for an explosion to count.
	# Default: 500
	# Range: 50 ~ 2000
	MaxSiegeRadius = 500
	#Seconds the GLOWING effect is applied to an attacker after they land a counted hit.
	# Default: 30
	# Range: 0 ~ 600
	AttackerGlowSeconds = 30
	#Minutes the attacker must hold a planted Siege Banner inside the Town Hall building for capture.
	# Default: 10
	# Range: 1 ~ 120
	BannerCaptureMinutes = 10
	#How many times an attacker may re-plant a destroyed Siege Banner before the capture path is locked for that war. 0 = no re-plants (one attempt only).
	# Default: 1
	# Range: 0 ~ 10
	BannerMaxReplants = 1
	#When true, defer war-damage block restoration to the Explosion't mod (if installed)
	#instead of the built-in WarBlockLedger. OFF by default.
	DeferRestorationToExplosiont = false

#Adds the players of a colony owner's faction to the colony's permissions automatically, and marks enemy factions as hostile.
["Faction Ranks"]
	#Master switch. When on, every player in a colony owner's faction is added to that colony's permissions
	#automatically (Friend, or Officer for faction officers). Works with the built-in factions and with Holdfast.
	Enabled = true
	#How often (ticks) to reconcile faction membership into colony ranks. 1200 = 60s.
	# Default: 1200
	# Range: 20 ~ 72000
	SyncIntervalTicks = 1200
	#Colony rank granted to faction members ('friend' or 'officer').
	MemberRank = "friend"
	#Grant the colony Officer rank to faction officers.
	PromoteOfficers = true
	#Players of factions your faction has marked as enemies get the Hostile rank in your faction's colonies, so guards treat them as enemies.
	HostileToEnemies = true
