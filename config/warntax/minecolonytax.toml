	[Espionage."Action Costs"]
		#Tax cost for SCOUT action (reveals enemy colony's current tax balance).
		# Default: 100
		# Range: 0 ~ 100000
		ScoutCost = 100
		#Tax cost for SABOTAGE action (reduces target's next tax cycle).
		# Default: 1500
		# Range: 0 ~ 100000
		SabotageCost = 1500
		#Tax cost for BRIBE GUARDS action (disables guards during next raid). High cost makes this a gamble given ~50% detection chance.
		# Default: 2500
		# Range: 0 ~ 100000
		BribeGuardsCost = 2500
		#Tax cost for STEAL SECRETS action (copy building synergy bonuses temporarily).
		# Default: 1000
		# Range: 0 ~ 100000
		StealSecretsCost = 1000

	[Espionage."Action Effects"]
		#Percentage reduction to target's tax for the next cycle when sabotaged (0.0-1.0). Example: 0.25 = 25% less tax.
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		SabotageTaxReductionPercent = 0.25
		#Number of guards disabled when BRIBE GUARDS action succeeds.
		# Default: 2
		# Range: 1 ~ 20
		BribeGuardsDisabledCount = 2
		#Duration in hours that stolen building synergy bonuses last.
		# Default: 24
		# Range: 1 ~ 168
		StealSecretsDurationHours = 24
		#Minutes a SABOTAGE spy must remain active at the target colony before the sabotage is considered planted and the mission auto-completes. Spies detected before this threshold apply no effect on escape.
		# Default: 30
		# Range: 1 ~ 240
		SabotageMinFieldMinutes = 30

	[Espionage."Detection Chances"]
		#Additional detection chance for SCOUT action (0.0-1.0). Low risk action.
		# Default: 0.05
		# Range: 0.0 ~ 1.0
		ScoutDetectionChance = 0.05
		#Additional detection chance for SABOTAGE action (0.0-1.0). Medium risk.
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		SabotageDetectionChance = 0.25
		#Additional detection chance for BRIBE GUARDS action (0.0-1.0). High risk - combined with base chance ~50% detection.
		# Default: 0.45
		# Range: 0.0 ~ 1.0
		BribeGuardsDetectionChance = 0.45
		#Additional detection chance for STEAL SECRETS action (0.0-1.0). Medium-high risk.
		# Default: 0.3
		# Range: 0.0 ~ 1.0
		StealSecretsDetectionChance = 0.3

	[Espionage."Progressive Intel"]
		#Minutes a spy must be active before Tier 1 intel is gathered (colony name, citizen count, building count, war status).
		# Default: 2
		# Range: 0 ~ 60
		IntelEarlyThresholdMinutes = 2
		#Minutes a spy must be active before Tier 2 intel is gathered (guard count, happiness, tax balance).
		# Default: 10
		# Range: 1 ~ 120
		IntelMidThresholdMinutes = 10
		#Minutes a spy must be active before Tier 3 intel is gathered (owner SDM balance, officer balances, colony member list).
		# Default: 30
		# Range: 5 ~ 240
		IntelLateThresholdMinutes = 30

	[Espionage."Flee Behavior"]
		#Speed multiplier applied to a spy when fleeing detection (1.0 = normal speed).
		# Default: 1.5
		# Range: 1.0 ~ 3.0
		FleeSpeedMultiplier = 1.5
		#How many blocks past the colony border a spy must reach to escape.
		# Default: 5
		# Range: 1 ~ 50
		FleeEscapeDistance = 5
		#Maximum seconds a spy has to flee before being caught.
		# Default: 30
		# Range: 10 ~ 120
		FleeMaxSeconds = 30

	[Espionage."Travel Phase"]
		#Spy travel speed in blocks per minute. Determines how long it takes to reach the target colony.
		# Default: 200
		# Range: 50 ~ 2000
		SpyTravelBlocksPerMinute = 200
		#Minimum travel time in minutes, regardless of distance.
		# Default: 1
		# Range: 0 ~ 30
		SpyTravelMinMinutes = 1
		#Maximum travel time cap in minutes, regardless of distance.
		# Default: 15
		# Range: 1 ~ 60
		SpyTravelMaxMinutes = 15

	[Espionage."Spy Map"]
		#When true, a pre-filled map of the target colony area is given to the player whenever their spy returns successfully (completed, escaped, or recalled).
		SpyMapEnabled = true
		#Scale of the returned spy map. 0 = 128 blocks, 1 = 256 blocks, 2 = 512 blocks, 3 = 1024 blocks, 4 = 2048 blocks. Higher values cover more area at the cost of per-block detail.
		# Default: 1
		# Range: 0 ~ 4
		SpyMapScale = 1

