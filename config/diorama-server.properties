# Diorama on this server: which part of the map players with Diorama share.
# Players without Diorama, and servers without it, are unaffected.

# true: players with Diorama see land other players explored on their map, drawn with
# their own resource pack. Only the view from the sky; caves stay what each player found.
share-map=true

# Which land is shared:
#   visited   - chunks players have spent time near (default)
#   generated - every finished chunk in the world, for worlds pre-generated with Chunky and the like
share-land=visited

# The most this server sends each player for the shared map, in kilobytes a second.
share-kilobytes-per-second=500

# Map settings this server decides for players with Diorama. Their own settings come back
# when they leave. false: no cave maps underground, only the view from the sky; in the
# Nether, only what each player has seen under the roof. The web map can't know what
# each player has seen, so it leaves out the Nether while this is false.
cave-maps-allowed=true

# true: cave maps show only the blocks each player has seen (fog of war), and players
# can't turn it off. The web map leaves out the Nether while this is true.
cave-fog-of-war=false

# false: no players or mobs on the minimap or the map.
radar-allowed=true

# Dimensions where Diorama is off: no minimap, no map, no waypoints in the world, and
# nothing is mapped there; the web map leaves them out too. Dimension IDs separated by
# commas, for example minecraft:the_nether,somemod:maze. Empty: the map works in every
# dimension.
map-off-dimensions=

# The web map: this server draws its map, in vanilla colours, for anyone to see in a browser.
# Off unless set to true. It covers the same land as the shared map (share-land).
web-map=true

# NeroCraft: zona disegnata dalla mappa web, separata da share-land (che resta per la mappa in gioco).
# Funziona solo con la patch di tools/patch_server_mods.py sul jar del server.
#   generated - tutto il mondo pre-generato    visited - solo dove sono passati i giocatori
web-map-land=generated

# The port of the web map's own web server, at http://<this server>:<port>/. Set it to 0
# to only write the map's files to web-map-folder, for a web server of your own to serve.
web-map-port=8100

# The address the web map's server listens on: empty for every address, or 127.0.0.1 to
# reach it only through a web server of your own on this machine.
web-map-address=

# Where the web map's files go. Empty: diorama-web in the world folder.
web-map-folder=
